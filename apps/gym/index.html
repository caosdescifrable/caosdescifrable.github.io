<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f5ef">
  <link rel="manifest" href="../../manifest.webmanifest"><link rel="icon" type="image/png" href="../../icon-192.png">
  <title>Mi gimnasio</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script>
</head>
<body><main class="shell">
  <a class="apps-link" href="../../">← Aplicaciones</a>
  <nav class="modes" aria-label="Modo de uso"><button id="catalog-mode" class="mode" type="button" aria-pressed="false">Ejercicios</button><button id="session-mode" class="mode active" type="button" aria-pressed="true">Megaset</button></nav>
  <section id="catalog" hidden><div class="search-area"><label for="search">BUSCAR UN EJERCICIO</label><div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Busca por nombre..." autocomplete="off"></div></div>
    <div class="filters"><div class="filter-switch"><span>Todas</span><label class="switch"><input id="filter-mode" type="checkbox" aria-label="Activar filtros de etiquetas" aria-controls="tag-f-filters"><span class="switch-track" aria-hidden="true"></span></label><span>Filtradas</span></div><div id="tag-f-filters" hidden><div id="tag-groups"></div><label class="match-mode" for="match-mode">Mostrar ejercicios que tengan <select id="match-mode"><option value="and">todas las etiquetas (AND)</option><option value="or">alguna etiqueta (OR)</option></select></label></div></div>
    <div class="section-heading"><h1>Ejercicios</h1><p id="count" aria-live="polite"></p></div><div id="exercises" class="grid" aria-live="polite">Cargando ejercicios...</div>
  </section>
  <section id="session"><div class="session-picker"><label for="megaset">ELIGE UN MEGASET</label><select id="megaset"></select><p>Continúa donde lo dejaste. Al completar un ejercicio, pasa al final de la cola.</p></div><div id="session-content" aria-live="polite">Cargando megaset...</div></section>
  <section id="detail" hidden></section>
</main></body></html>
