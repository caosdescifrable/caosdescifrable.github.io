<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6624c9">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>Mis aplicaciones</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#26372d;font-family:Arial,sans-serif}main{max-width:780px;margin:0 auto;padding:clamp(40px,10vh,100px) 20px}h1{font:400 clamp(36px,6vw,50px) Georgia,serif;letter-spacing:-1px;margin:0 0 32px}.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.app{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:230px;padding:28px;background:#fff;border:1px solid #e2e6dc;color:inherit;text-decoration:none;transition:border-color .2s,transform .2s}.app:hover{border-color:#8da78d;transform:translateY(-2px)}.app:focus-visible{outline:3px solid #405e45;outline-offset:3px}.emoji{font-size:64px;line-height:1}.name{font:400 30px Georgia,serif}.arrow{float:right;color:#b97050;font:24px Arial,sans-serif}.bottom{width:100%}@media(max-width:500px){main{padding-top:38px}.apps{grid-template-columns:1fr;gap:14px}.app{min-height:160px;padding:22px}.emoji{font-size:52px}.name{font-size:27px}}
  </style>
</head>
<body>
  <main>
    <h1>Mis aplicaciones</h1>
    <div class="apps">
      <a class="app" href="apps/cook/"><span class="emoji" aria-hidden="true">🍗</span><span class="bottom"><span class="name">Recetas</span><span class="arrow" aria-hidden="true">↗</span></span></a>
      <a class="app" href="apps/gym/"><span class="emoji" aria-hidden="true">💪</span><span class="bottom"><span class="name">Gym</span><span class="arrow" aria-hidden="true">↗</span></span></a>
    </div>
  </main>
</body>
</html>
